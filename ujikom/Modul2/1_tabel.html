<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <tr>
            <th>Sesi</th>
            <th colspan="2">Nilai 1</th>
            <th>Nilai 2</th>
        </tr>
        <tr>
            <th rowspan="3">Sesi 1</th>
            <td>80</td>
            <td>81</td>
            <td>82</td>
        </tr>
        <tr>
            <td>90</td>
            <td>91</td>
            <td>92</td>
        </tr>
        <tr>
            <td colspan="3">SAMA</td>
        </tr>
    </table>
</body>
</html>
